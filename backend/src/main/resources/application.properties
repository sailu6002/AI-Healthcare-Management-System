# JPA / Hibernate
# Schema is owned by the explicit SQL migrations in database/migrations/.
# "validate" (not "update") so Hibernate never mutates production tables.
# Run database/migrations/phase4_2_appointment_safety.sql before first startup
# against a database created before Phase 4.2.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

